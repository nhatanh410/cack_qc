# Cấu hình cho create-bug-issue.sh / sync-bug-status.sh (được `source` bởi bash). KHÔNG đặt token ở đây.
# Nguồn: issue form "QC bug" tại .github/ISSUE_TEMPLATE/qc-bug.yml của chính repo này (tạo ngày 2026-10-26).
# Bản cấu hình cũ của dự án Ink: 3ada18a:scripts/bug-issue.conf

# Repo nhận issue (owner/name). Dự án CACK dùng luôn repo QC cho issue bug.
# ⚠️ Repo đang PUBLIC (2026-10-26) — issue sẽ hiện công khai. Chuyển private trước khi submit bug thật.
REPO="nhatanh410/cack_qc"

# Bug log nguồn (đường dẫn tương đối từ gốc repo QC).
BUG_LOG="bugs/bug-log.md"

# Label mà form tự gắn (labels: trong form). Cách nhau bằng dấu phẩy. Label phải tồn tại trên repo.
LABELS="qc-bug,needs-triage"

# Heading trong body = `label` của từng field trong form (GitHub render thành "### <label>").
H_BUILD="Phiên bản"
H_INSTALL="Nền tảng"
H_DEVICE="Thiết bị / Trình duyệt"
H_LANG="Vai trò tài khoản"
H_STEPS="Các bước tái hiện"
H_EXPECTED="Mong đợi"
H_ACTUAL="Thực tế"
H_FREQ="Tần suất"
H_SEVERITY="Mức độ"
H_ATTACH="Ảnh, video, log"

# Option của các dropdown — phải khớp NGUYÊN VĂN với form (một option mỗi phần tử).
INSTALL_OPTIONS=(
  "App mobile"
  "Web quản trị"
)
FREQ_OPTIONS=("Luôn luôn" "Thỉnh thoảng" "Chỉ gặp một lần")
SEVERITY_OPTIONS=(
  "critical — crash, mất dữ liệu, lộ dữ liệu cá nhân, sai quyền, chặn luồng chính"
  "major — sai chức năng, có cách né"
  "minor — lỗi hiển thị, chữ, chi tiết nhỏ"
)
